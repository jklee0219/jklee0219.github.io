<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인증 완료</title>
<style>
:root{--bg:#faf8f4;--ink:#2a2420;--sub:#6b625a;--accent:#a9552b}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--ink:#ece5da;--sub:#9a9086}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
 color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
.box{max-width:32rem;padding:2rem 1.5rem;text-align:center}
h1{font-size:1.3rem;margin:0 0 .8rem}
p{color:var(--sub);margin:.4rem 0}
code{display:block;margin-top:1.5rem;padding:1rem;background:rgba(127,127,127,.12);
 border-radius:.4rem;font-size:.8rem;word-break:break-all;text-align:left;color:var(--ink)}
</style></head><body><div class="box">
<h1>인증이 처리되었습니다</h1>
<p>이 창의 <strong>주소창 전체</strong>를 복사해서 전달하세요.</p>
<p>주소에 포함된 코드로 연동이 완료됩니다.</p>
<code id="u"></code>
<script>document.getElementById("u").textContent=location.href;</script>
</div></body></html>
